name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check app tests

      - name: Tests
        run: pytest

      - name: Schema smoke test
        run: python -c "from app.config import Settings; from app.main import create_app; from pathlib import Path; s=Settings('test', Path('var/ci.db'), Path('var/ci-evidence'), 'ci-secret-that-is-long-enough-1234'); create_app(s); print('app boot ok')"

      - name: Secret-pattern scan
        run: |
          if git grep -nE -- \
            -e 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' \
            -e '(ghp_|github_pat_|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})' \
            -- ':!.github/workflows/ci.yml' ':!tests/**' ; then
            echo "::error::Potential secret detected in tracked files"
            exit 1
          fi
          echo "No high-confidence secret patterns found."
